<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; --danger: #dc2626; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111318; --card: #1b1e25; --text: #e6e8ec; --muted: #9aa1ad; --accent: #60a5fa; --danger: #f87171; --line: #2a2e37; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 28px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { background: transparent; color: var(--danger); padding: 4px 8px; }
    .empty, .count { color: var(--muted); padding: 12px; text-align: center; }
    .count { padding: 8px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Todo</h1>
    <form id="add-form">
      <input id="new-task" type="text" placeholder="What needs doing?" autocomplete="off" required aria-label="New task">
      <button type="submit">Add</button>
    </form>
    <ul id="list" aria-live="polite"></ul>
    <p class="count" id="count"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
